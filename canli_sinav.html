<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Akademi Kampı</title>
    <style>
        body { background-color: #1a1e24; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #242a33; border-radius: 12px; padding: 30px; width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #374151; margin-top: 2vh; }
        .header { text-align: center; border-bottom: 1px solid #374151; padding-bottom: 15px; margin-bottom: 25px; }
        .header h2 { color: #f59e0b; font-size: 18px; margin: 0; text-transform: uppercase; letter-spacing: 2px; }
        .login-input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #1a1e24; border: 2px solid #374151; color: white; font-size: 16px; box-sizing: border-box; text-align: center; font-weight: bold; }
        .login-input:focus { border-color: #10b981; outline: none; }
        .login-btn { background: #10b981; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-btn:hover { background: #059669; }
        
        .timer-kutu { text-align: center; margin-bottom: 20px; }
        #zaman-gosterge { font-size: 55px; font-weight: bold; color: #10b981; text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); transition: color 0.3s; }
        #zaman-gosterge.tehlike { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        
        .soru-metni { font-size: 17px; font-weight: 600; margin-bottom: 25px; line-height: 1.6; color: #f8fafc; }
        .secenek-btn { background-color: #2a313c; border: 2px solid #4b5563; color: #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 12px; width: 100%; text-align: left; font-size: 15px; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden; }
        .secenek-btn:hover:not(:disabled) { border-color: #6b7280; background-color: #374151; }
        .secenek-btn.secildi { border-color: #3b82f6; background-color: rgba(59, 130, 246, 0.15); }
        .secenek-btn.dogru { border-color: #10b981; background-color: rgba(16, 185, 129, 0.15); }
        .secenek-btn.yanlis { border-color: #ef4444; background-color: rgba(239, 68, 68, 0.15); }
        .harf { color: #f59e0b; font-weight: bold; margin-right: 8px; }
        
        .sonuc-bari { position: absolute; left: 0; top: 0; height: 100%; z-index: 0; transition: width 0.5s ease-in-out; opacity: 0.2; width: 0%; }
        .sonuc-bari.dogru-renk { background-color: #10b981; opacity: 0.3; }
        .sonuc-bari.yanlis-renk { background-color: #ef4444; opacity: 0.2; }
        .sonuc-bari.standart-renk { background-color: #9ca3af; opacity: 0.15; }
        .secenek-icerik { position: relative; z-index: 1; display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .yuzde-yazi { font-size: 13px; font-weight: bold; color: #9ca3af; display: none; }
        
        .bekleniyor { text-align: center; color: #9ca3af; font-style: italic; margin-top: 20px; font-size: 18px; }
        .rapor-satir { display: flex; justify-content: space-between; padding: 15px; background: #1a1e24; border-radius: 8px; margin-bottom: 12px; font-size: 16px; font-weight: bold; }
        
        /* YENİ EKLENEN CSS: İnceleme Modalı */
        #incelemeModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:flex-start; padding: 20px; box-sizing: border-box; overflow-y:auto; }
        .inceleme-kutu { background:#242a33; border-radius:12px; padding:25px; width:100%; max-width:650px; border: 1px solid #374151; margin-top: 20px; margin-bottom: 40px; }
        .inceleme-soru-item { background: #1a1e24; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #374151; }
        .inceleme-sik { padding: 8px 12px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #4b5563; font-size: 14px; }
        .inceleme-sik.dogru-sik { border-color: #10b981; background: rgba(16, 185, 129, 0.15); color: #10b981; font-weight: bold; }
        .inceleme-sik.yanlis-sik { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="container" id="login-alani" style="display: none; text-align: center;">
        <div class="header"><h2>🎓 SMM AKADEMİ'YE HOŞ GELDİN</h2></div>
        <p style="color: #9ca3af; margin-bottom: 25px;">Kamp sonu kişisel karneni oluşturabilmemiz için lütfen adını soyadını gir.</p>
        <input type="text" id="kullaniciInput" class="login-input" placeholder="Örn: İsim Soyisim">
        <button id="kampaKatilBtn" class="login-btn">🚀 Kampa Katıl</button>
    </div>

    <div class="container" id="sinav-ana-kasa" style="display: none;">
        <div class="header"><h2>👑 SMM AKADEMİ KAMPI</h2></div>
        <div id="soru-yukleniyor" class="bekleniyor">Oturum başlatılıyor, yeni soru bekleniyor...</div>
        
        <div id="sinav-alani" style="display: none;">
            <div id="soru-sayaci" style="text-align: center; color: #9ca3af; font-size: 14px; font-weight: bold; margin-bottom: 10px; letter-spacing: 1px;"></div>
            <div class="timer-kutu"><div id="zaman-gosterge">90</div></div>
            <div class="soru-metni" id="soru-metni"></div>
            <div id="secenekler-kapsayici"></div>
        </div>
    </div>

    <div class="container" id="rapor-alani" style="display: none; text-align: center;">
        <div class="header"><h2>🏆 KAMP SONU KARNESİ</h2></div>
        <h3 id="rapor-isim" style="color: #f59e0b; margin-bottom: 25px; font-size: 22px;"></h3>
        
        <div class="rapor-satir" style="border-left: 5px solid #10b981;"><span>✅ Doğru Cevap:</span> <span id="rapor-dogru" style="color: #10b981;">0</span></div>
        <div class="rapor-satir" style="border-left: 5px solid #ef4444;"><span>❌ Yanlış Cevap:</span> <span id="rapor-yanlis" style="color: #ef4444;">0</span></div>
        <div class="rapor-satir" style="border-left: 5px solid #9ca3af;"><span>⚪ Boş Bırakılan:</span> <span id="rapor-bos" style="color: #9ca3af;">0</span></div>

        <button id="cevaplariInceleBtn" class="login-btn" style="margin-top: 20px; background: #3b82f6;">🔍 Çözdüğüm Soruları İncele</button>
        <button id="pdfIndirBtn" class="login-btn" style="margin-top: 10px; background: #059669;">📄 Karnemi PDF Olarak İndir</button>
        <button id="raporKapatBtn" class="login-btn" style="margin-top: 15px; background: #4b5563;">Kapat ve Bekleme Salonuna Dön</button>
    </div>

    <div id="incelemeModal">
        <div class="inceleme-kutu">
            <h2 style="color: #3b82f6; text-align: center; margin-top: 0; border-bottom: 1px solid #374151; padding-bottom: 15px;">🔍 SORU İNCELEME</h2>
            <div id="inceleme-icerik-alani"></div>
            <button id="incelemeKapatBtn" class="login-btn" style="margin-top: 25px; background: #ef4444;">Kapat</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBlnd8CoQKRlYCF0HCv3AjSq5y9pZD4fMM",
        authDomain: "smmakademi-d4dc5.firebaseapp.com",
        projectId: "smmakademi-d4dc5",
        storageBucket: "smmakademi-d4dc5.firebasestorage.app",
        messagingSenderId: "301579033232",
        appId: "1:301579033232:web:fee03384d4b900a2445615"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const soruRef = doc(db, "aktif_sinav", "guncel_soru");

    let kullaniciAdi = localStorage.getItem("smm_isim");
    let istatistik = { dogru: 0, yanlis: 0, bos: 0 };
    let soruGecmisi = []; 

    try {
        if(localStorage.getItem("smm_istatistik")) istatistik = JSON.parse(localStorage.getItem("smm_istatistik"));
        if(localStorage.getItem("smm_soru_gecmisi")) soruGecmisi = JSON.parse(localStorage.getItem("smm_soru_gecmisi"));
    } catch (e) { }

    let secilenSik = "";
    let sayacInterval;
    let kalanSure = 90;
    let sureBittiMi = false;
    let guncelData = null;
    let raporGonderildiMi = false;
    let skorEklendiMi = false;

    if(!kullaniciAdi) {
        document.getElementById("login-alani").style.display = "block";
    } else {
        document.getElementById("sinav-ana-kasa").style.display = "block";
        baslaDinlemeye();
    }

    document.getElementById("kampaKatilBtn").addEventListener("click", () => {
        let girilenIsim = document.getElementById("kullaniciInput").value.trim();
        if(girilenIsim.length > 2) {
            localStorage.setItem("smm_isim", girilenIsim);
            kullaniciAdi = girilenIsim;
            istatistik = { dogru: 0, yanlis: 0, bos: 0 };
            soruGecmisi = [];
            localStorage.setItem("smm_istatistik", JSON.stringify(istatistik));
            localStorage.setItem("smm_soru_gecmisi", JSON.stringify(soruGecmisi));
            
            document.getElementById("login-alani").style.display = "none";
            document.getElementById("sinav-ana-kasa").style.display = "block";
            baslaDinlemeye();
        } else {
            alert("Lütfen geçerli bir isim gir!");
        }
    });

    // Rapor Kapatma ve YENİ TEST İÇİN SIFIRLAMA (Hafıza Temizliği)
    document.getElementById("raporKapatBtn").addEventListener("click", () => {
        document.getElementById("rapor-alani").style.display = "none";
        document.getElementById("sinav-ana-kasa").style.display = "block";
        document.getElementById("sinav-alani").style.display = "none";
        document.getElementById("soru-yukleniyor").style.display = "block";
        
        document.getElementById("soru-yukleniyor").innerText = "Önceki test verileri temizlendi. Yeni oturum bekleniyor...";

        istatistik = { dogru: 0, yanlis: 0, bos: 0 };
        soruGecmisi = [];
        skorEklendiMi = false;
        raporGonderildiMi = false;
        secilenSik = "";
        window.aktifSoruNo = 0; 

        localStorage.removeItem("smm_istatistik");
        localStorage.removeItem("smm_soru_gecmisi");
        localStorage.removeItem("smm_aktif_soru_no");
        localStorage.removeItem("smm_kalan_sure");
        localStorage.removeItem("son_soru"); 
    });

    // PDF Olarak İndirme Fonksiyonu
    document.getElementById("pdfIndirBtn").addEventListener("click", () => {
        const element = document.getElementById("rapor-alani");
        
        const butonlar = document.querySelectorAll("#pdfIndirBtn, #cevaplariInceleBtn, #raporKapatBtn");
        butonlar.forEach(b => b.style.display = "none");

        const opt = {
            margin:       10,
            filename:     `SMM_Akademi_Karne_${kullaniciAdi}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, backgroundColor: "#242a33" }, 
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            butonlar.forEach(b => b.style.display = "block");
          
        });
    });

    // İnceleme Modalı Açma
    document.getElementById("cevaplariInceleBtn").addEventListener("click", () => {
        gecmisiCiz();
        document.getElementById("incelemeModal").style.display = "flex";
    });

    // İnceleme Modalı Kapatma
    document.getElementById("incelemeKapatBtn").addEventListener("click", () => {
        document.getElementById("incelemeModal").style.display = "none";
    });

    function baslaDinlemeye() {
        onSnapshot(soruRef, (docSnap) => {
            if (docSnap.exists()) {
                guncelData = docSnap.data();
                
                if(guncelData && guncelData.kamp_bitti) {
                    clearInterval(sayacInterval);

                    // --- YENİ EKLENEN: KAMP BİTİNCE ZORUNLU TESLİM ---
                    // Kamp aniden biterse ve adayın süresi donmuşsa son soruyu zorla kurtar
                    if (window.aktifSoruNo > 0 && !skorEklendiMi) {
                        let eskiDogru = window.aktifDogruCevap;
                        if(!secilenSik) istatistik.bos++;
                        else if(secilenSik === eskiDogru) istatistik.dogru++;
                        else istatistik.yanlis++;
                        
                        setDoc(doc(db, "kamp_sonuclari", kullaniciAdi), {
                            dogru: istatistik.dogru, yanlis: istatistik.yanlis, bos: istatistik.bos, zaman: new Date()
                        }).catch(e => console.error(e));
                        skorEklendiMi = true;
                    }
                    // -------------------------------------------------

                    document.getElementById("sinav-ana-kasa").style.display = "none";
                    document.getElementById("rapor-alani").style.display = "block";
                    
                    document.getElementById("rapor-isim").innerText = kullaniciAdi;
                    document.getElementById("rapor-dogru").innerText = istatistik.dogru;
                    document.getElementById("rapor-yanlis").innerText = istatistik.yanlis;
                    document.getElementById("rapor-bos").innerText = istatistik.bos;

                    if(!raporGonderildiMi) {
                        setDoc(doc(db, "kamp_sonuclari", kullaniciAdi), {
                            dogru: istatistik.dogru, yanlis: istatistik.yanlis, bos: istatistik.bos, zaman: new Date()
                        }).catch(e => console.error(e));
                        raporGonderildiMi = true;
                    }
                    return;
                }

                document.getElementById("rapor-alani").style.display = "none";
                document.getElementById("incelemeModal").style.display = "none"; 

                let sayfaBosMu = document.getElementById("sinav-alani").style.display === "none";
                let firebaseSoruNo = guncelData.soru_no;
                let hafizaSoruNo = parseInt(localStorage.getItem("smm_aktif_soru_no")) || 0;
                let yeniSoruGeldi = (window.aktifSoruNo !== firebaseSoruNo);

                // --- YENİ EKLENEN: MOBİL YAVAŞLAMA İÇİN ZORUNLU TESLİM ---
                if (yeniSoruGeldi && window.aktifSoruNo > 0 && !skorEklendiMi) {
                    let eskiDogru = window.aktifDogruCevap;
                    let eskiMetin = window.aktifSoruMetni;
                    let eskiSecenekler = window.aktifSecenekler;

                    if(!secilenSik) istatistik.bos++;
                    else if(secilenSik === eskiDogru) istatistik.dogru++;
                    else istatistik.yanlis++;

                    soruGecmisi.push({
                        no: window.aktifSoruNo, soru: eskiMetin, secenekler: eskiSecenekler, secilen: secilenSik, dogru: eskiDogru
                    });

                    localStorage.setItem("smm_istatistik", JSON.stringify(istatistik));
                    localStorage.setItem("smm_soru_gecmisi", JSON.stringify(soruGecmisi));

                    setDoc(doc(db, "kamp_sonuclari", kullaniciAdi), {
                        dogru: istatistik.dogru, yanlis: istatistik.yanlis, bos: istatistik.bos, zaman: new Date()
                    }).catch(e => console.log(e));
                    
                    skorEklendiMi = true;
                }
                // ---------------------------------------------------------

                if(sayfaBosMu || yeniSoruGeldi) {
                    secilenSik = "";
                    sureBittiMi = false;
                    skorEklendiMi = false;
                    raporGonderildiMi = false;
                    window.aktifSoruNo = firebaseSoruNo; 

                    // --- YENİ EKLENEN: ZORUNLU TESLİM İÇİN SORU KİMLİĞİ HAFIZASI ---
                    window.aktifDogruCevap = guncelData.dogru_cevap;
                    window.aktifSoruMetni = guncelData.soru_metni;
                    window.aktifSecenekler = guncelData.secenekler;
                    // ---------------------------------------------------------------

                    if(firebaseSoruNo === 1 && yeniSoruGeldi) {
                        istatistik = { dogru: 0, yanlis: 0, bos: 0 };
                        soruGecmisi = [];
                        localStorage.setItem("smm_istatistik", JSON.stringify(istatistik));
                        localStorage.setItem("smm_soru_gecmisi", JSON.stringify(soruGecmisi));
                    }

                    // F5 Koruması
                    if (firebaseSoruNo === hafizaSoruNo) {
                        let hafizaSure = parseInt(localStorage.getItem("smm_kalan_sure"));
                        kalanSure = (isNaN(hafizaSure) || hafizaSure <= 0) ? 0 : hafizaSure;
                    } else {
                        kalanSure = 90;
                        localStorage.setItem("smm_aktif_soru_no", firebaseSoruNo);
                        localStorage.setItem("smm_kalan_sure", 90);
                    }

                    if(kalanSure <= 0) {
                        kalanSure = 0;
                        sureBittiMi = true;
                        arayuzuCiz(guncelData);
                        document.getElementById("zaman-gosterge").innerText = "0";
                        sonuclariAc(guncelData);
                    } else {
                        document.getElementById("sinav-alani").style.display = "none";
                        document.getElementById("soru-yukleniyor").style.display = "block";
                        document.getElementById("soru-yukleniyor").innerText = "Soru hazırlanıyor, lütfen bekleyin...";

                        setTimeout(() => {
                            arayuzuCiz(guncelData);
                            sayaciBaslat(); 
                        }, 400);
                    }
                } 
                else if (sureBittiMi) {
                    sonuclariAc(guncelData);
                }
            }
        });
    }
    
    function sayaciBaslat() {
        clearInterval(sayacInterval);
        const gosterge = document.getElementById("zaman-gosterge");
        gosterge.classList.remove("tehlike");
        gosterge.innerText = kalanSure;

        sayacInterval = setInterval(() => {
            kalanSure--;
            localStorage.setItem("smm_kalan_sure", kalanSure); 

            if(kalanSure <= 10 && kalanSure > 0) gosterge.classList.add("tehlike");

            if(kalanSure <= 0) {
                clearInterval(sayacInterval);
                sureBittiMi = true;
                gosterge.innerText = "0"; 
                sonuclariAc(guncelData); 
            } else {
                gosterge.innerText = kalanSure;
            }
        }, 1000);
    }

    function arayuzuCiz(data) {
        document.getElementById("soru-yukleniyor").style.display = "none";
        document.getElementById("sinav-alani").style.display = "block";
        document.getElementById("soru-metni").innerHTML = data.soru_metni;
        document.getElementById("soru-sayaci").innerText = `Soru: ${data.soru_no} / ${data.toplam_soru}`;

        const seceneklerDiv = document.getElementById("secenekler-kapsayici");
        seceneklerDiv.innerHTML = ""; 

        const harfler = ["A", "B", "C", "D", "E"];
        harfler.forEach(harf => {
            const btn = document.createElement("button");
            btn.className = `secenek-btn`;
            btn.id = `btn-${harf}`;
            
            btn.innerHTML = `
                <div class="sonuc-bari" id="bar-${harf}"></div>
                <div class="secenek-icerik">
                    <span><span class="harf">${harf})</span> ${data.secenekler[harf]}</span>
                    <span class="yuzde-yazi" id="yuzde-${harf}">%0</span>
                </div>
            `;

            btn.onclick = () => { 
                if(!sureBittiMi) {
                    let oncekiSik = secilenSik;
                    secilenSik = harf;
                    document.querySelectorAll('.secenek-btn').forEach(b => b.classList.remove('secildi'));
                    btn.classList.add("secildi");
                    
                    try {
                        if (oncekiSik && oncekiSik !== harf) {
                            updateDoc(soruRef, {
                                [`oylar.${oncekiSik}`]: increment(-1),
                                [`oylar.${harf}`]: increment(1)
                            });
                        } else if (!oncekiSik) {
                            updateDoc(soruRef, { [`oylar.${harf}`]: increment(1) });
                        }
                    } catch(e) { }
                }
            };
            seceneklerDiv.appendChild(btn);
        });
    }

    function sonuclariAc(data) {
        const harfler = ["A", "B", "C", "D", "E"];
        harfler.forEach(harf => {
            const btn = document.getElementById(`btn-${harf}`);
            btn.disabled = true; 
            if(harf === data.dogru_cevap) {
                btn.classList.add("dogru");
                document.getElementById(`bar-${harf}`).classList.add("dogru-renk");
            } else if(secilenSik === harf) {
                btn.classList.add("yanlis");
                document.getElementById(`bar-${harf}`).classList.add("yanlis-renk");
            } else {
                document.getElementById(`bar-${harf}`).classList.add("standart-renk");
            }
        });
        
        if(!skorEklendiMi) {
            if(!secilenSik) istatistik.bos++;
            else if(secilenSik === data.dogru_cevap) istatistik.dogru++;
            else istatistik.yanlis++;
            
            soruGecmisi.push({
                no: data.soru_no,
                soru: data.soru_metni,
                secenekler: data.secenekler,
                secilen: secilenSik,
                dogru: data.dogru_cevap
            });

            localStorage.setItem("smm_istatistik", JSON.stringify(istatistik));
            localStorage.setItem("smm_soru_gecmisi", JSON.stringify(soruGecmisi));
            skorEklendiMi = true;

            // CANLI OTOMATİK KAYIT (AUTO-SAVE)
            setDoc(doc(db, "kamp_sonuclari", kullaniciAdi), {
                dogru: istatistik.dogru, 
                yanlis: istatistik.yanlis, 
                bos: istatistik.bos, 
                zaman: new Date()
            }).catch(e => console.log("Otomatik kayıt hatası:", e));
        }
        barlariGuncelle(data);
    }
    
    function barlariGuncelle(data) {
        let toplamOy = Object.values(data.oylar).reduce((a, b) => a + b, 0) || 1;
        const harfler = ["A", "B", "C", "D", "E"];
        harfler.forEach(harf => {
            const oySayisi = data.oylar[harf];
            const yuzde = Math.round((oySayisi / toplamOy) * 100);
            document.getElementById(`bar-${harf}`).style.width = `${yuzde}%`;
            const yaziElementi = document.getElementById(`yuzde-${harf}`);
            yaziElementi.style.display = "inline";
            yaziElementi.innerText = `%${yuzde} (${oySayisi})`;
        });
    }

    function gecmisiCiz() {
        const alan = document.getElementById("inceleme-icerik-alani");
        alan.innerHTML = "";
        
        if (soruGecmisi.length === 0) {
            alan.innerHTML = "<div style='text-align:center; color:#9ca3af; margin-top:20px;'>Bu testte çözdüğünüz veya gördüğünüz soru bulunamadı.</div>";
            return;
        }

        soruGecmisi.forEach(k => {
            let kutu = document.createElement("div");
            kutu.className = "inceleme-soru-item";
            
            let html = `<div style="color:#9ca3af; font-size:13px; margin-bottom:8px; font-weight:bold;">Soru ${k.no}</div>`;
            html += `<div style="font-size:16px; font-weight:bold; margin-bottom:15px; color:#f8fafc;">${k.soru}</div>`;
            
            const harfler = ["A", "B", "C", "D", "E"];
            harfler.forEach(h => {
                let sinif = "inceleme-sik";
                
                if (h === k.dogru) {
                    sinif += " dogru-sik";
                } else if (h === k.secilen) {
                    sinif += " yanlis-sik";
                }
                
                html += `<div class="${sinif}"><strong>${h})</strong> ${k.secenekler[h]}</div>`;
            });
            
            if(!k.secilen) {
                html += `<div style="color:#f59e0b; font-size:13px; margin-top:10px; font-style:italic;">⚠️ Bu soruyu boş bıraktınız.</div>`;
            }

            kutu.innerHTML = html;
            alan.appendChild(kutu);
        });
    }
</script>
</body>
</html>
