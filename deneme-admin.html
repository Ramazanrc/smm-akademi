<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SMM Serbest Deneme Yönetimi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e272e; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { background: #2f3640; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 600px; text-align: center; }
        h2 { color: #fbc531; margin-top: 0; border-bottom: 1px solid #718093; padding-bottom: 10px; margin-bottom: 20px;}
        .kontrol-paneli { background: #353b48; padding: 20px; border-radius: 8px; border: 1px solid #718093; margin-bottom: 20px; text-align: left; }
        .ayar-satiri { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 15px; }
        input[type="file"] { padding: 10px; background: #2f3640; border-radius: 5px; color: white; width: 100%; box-sizing: border-box; margin-bottom: 15px; border: 1px dashed #fbc531;}
        input[type="number"] { padding: 8px; border-radius: 5px; border: 1px solid #fbc531; background: #2f3640; color: white; width: 80px; text-align: center; font-weight: bold; }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; color: white; margin-bottom: 10px; }
        button:disabled { background: #718093 !important; cursor: not-allowed; opacity: 0.5; }
        #baslatBtn { background: #4cd137; } #baslatBtn:hover:not(:disabled) { background: #44bd32; }
        #bitirBtn { background: #e84118; display: none; } #bitirBtn:hover { background: #c23616; }
        #raporBtn { background: #9b59b6; margin-top: 15px; } #raporBtn:hover { background: #8e44ad; }
        #durum { margin-top: 20px; font-size: 17px; font-weight: bold; color: #fbc531; background: #2f3640; padding: 15px; border-radius: 8px; border: 1px solid #fbc531;}
        
        /* YENİ: Yönetici Sayacı CSS */
        .admin-sayac { font-size: 24px; font-weight: bold; color: #fbc531; display: none; margin-bottom: 15px; border: 2px dashed #e84118; padding: 10px; border-radius: 8px;}
        .admin-sayac.tehlike { color: #e84118; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        table { width: 100%; text-align: left; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #718093; }
        th { color: #fbc531; border-bottom: 2px solid #fbc531; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 SMM SERBEST DENEME YÖNETİMİ</h2>
    <input type="file" id="jsonDosya" accept=".json">
    <div class="kontrol-paneli">
        <div class="ayar-satiri">
            <label>🎯 Sorulacak Soru Sayısı:</label>
            <input type="number" id="hedefSoru" value="20" min="1">
        </div>
        <div class="ayar-satiri">
            <label>⏱️ Toplam Süre (Dakika):</label>
            <input type="number" id="sinavSuresi" value="30" min="1">
        </div>
        
        <!-- YENİ: Yönetici Ekranında Geri Sayım -->
        <div id="adminSayacGosterge" class="admin-sayac">00:00</div>

        <button id="baslatBtn" disabled>🚀 Sınav Paketini Yükle ve Başlat</button>
        <button id="bitirBtn">⏹ Sınavı Zorla Bitir</button>
        <button id="raporBtn">📊 Deneme Sonuçlarını Gör</button>
    </div>
    <div id="durum">Sistem Hazır. JSON Bekleniyor...</div>
</div>

<!-- LİDERLİK TABLOSU MODALI -->
<div id="raporModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:#2f3640; padding:30px; border-radius:12px; width:95%; max-width:800px; max-height:80vh; overflow-y:auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
        <h2 style="color:#fbc531; text-align:center; border-bottom: none; margin-bottom: 15px;">🏆 DENEME SINAVI SIRALAMASI</h2>
        <div id="raporTabloAlani" style="color: white; font-size: 15px;">Yükleniyor...</div>
        <button id="kapatModalBtn" style="background:#e84118; margin-top:25px; width: 100%;">Kapat</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyBlnd8CoQKRlYCF0HCv3AjSq5y9pZD4fMM",
        authDomain: "smmakademi-d4dc5.firebaseapp.com",
        projectId: "smmakademi-d4dc5",
        storageBucket: "smmakademi-d4dc5.firebasestorage.app",
        messagingSenderId: "301579033232",
        appId: "1:301579033232:web:fee03384d4b900a2445615"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let anaSoruListesi = []; 
    let adminSayacInterval; // YENİ: Zamanlayıcı değişkeni
    const btnBaslat = document.getElementById('baslatBtn');
    const btnBitir = document.getElementById('bitirBtn');
    const durumYazisi = document.getElementById('durum');
    const raporBtn = document.getElementById('raporBtn');
    const adminSayacGosterge = document.getElementById('adminSayacGosterge'); // YENİ: Sayaç DOM öğesi

    document.getElementById('jsonDosya').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const hamData = JSON.parse(e.target.result);
                anaSoruListesi = []; 
                if (Array.isArray(hamData)) {
                    anaSoruListesi = hamData; 
                } else {
                    for (let kategori in hamData) {
                        if (Array.isArray(hamData[kategori])) anaSoruListesi = anaSoruListesi.concat(hamData[kategori]);
                    }
                }
                
                if(anaSoruListesi.length > 0) {
                    durumYazisi.innerHTML = `✅ Havuza <b>${anaSoruListesi.length}</b> soru çekildi. Başlatmaya hazır.`;
                    durumYazisi.style.color = "#4cd137";
                    document.getElementById('hedefSoru').max = anaSoruListesi.length;
                    btnBaslat.disabled = false;
                }
            } catch (error) {
                durumYazisi.innerText = "❌ JSON okunurken hata oluştu!";
                durumYazisi.style.color = "#e84118";
            }
        };
        reader.readAsText(file);
    });

    btnBaslat.addEventListener('click', async () => {
        let limit = parseInt(document.getElementById('hedefSoru').value);
        let sure = parseInt(document.getElementById('sinavSuresi').value);
        if(limit > anaSoruListesi.length) limit = anaSoruListesi.length;
        
        for (let i = anaSoruListesi.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [anaSoruListesi[i], anaSoruListesi[j]] = [anaSoruListesi[j], anaSoruListesi[i]];
        }
        let paketSorular = anaSoruListesi.slice(0, limit);
        
        let formatliSorular = paketSorular.map((jsonSoru, index) => {
            const harfler = ["A", "B", "C", "D", "E"];
            let dogruIndex = jsonSoru.answer !== undefined ? jsonSoru.answer : jsonSoru.correct;
            let gercekDogruCevap = harfler[dogruIndex]; 
            let temizSecenekler = {};
            for(let i = 0; i < 5; i++) {
                let hamMetin = jsonSoru.options[i] || "";
                temizSecenekler[harfler[i]] = hamMetin.replace(/^[A-E]\)\s*/i, '');
            }
            return { soru_no: index + 1, soru_metni: jsonSoru.q, secenekler: temizSecenekler, dogru_cevap: gercekDogruCevap };
        });

        btnBaslat.style.display = "none";
        btnBitir.style.display = "block";
        document.getElementById('hedefSoru').disabled = true;
        document.getElementById('sinavSuresi').disabled = true;
        durumYazisi.innerHTML = "⏳ Eski sonuçlar temizleniyor...";

        // Yeni sınava başlarken eski sonuçları veritabanından temizliyoruz
        try {
            const eskiSonuclar = await getDocs(collection(db, "deneme_sonuclari"));
            eskiSonuclar.forEach((docItem) => { deleteDoc(docItem.ref); });
        } catch (e) { console.error("Temizleme hatası:", e); }

        try {
            await setDoc(doc(db, "aktif_sinav", "deneme_paketi"), {
                sorular: formatliSorular, toplam_sure_dk: sure, baslangic_zamani: Date.now(), durum: "aktif"
            });
            durumYazisi.innerHTML = `🔥 Sınav Başladı!<br>${limit} Soru, ${sure} Dakika olarak sisteme yüklendi.`;
            
            // YENİ: Admin tarafında otomatik sayacı başlat
            baslatAdminSayaci(sure);

        } catch (e) {
            console.error(e);
            durumYazisi.innerHTML = "❌ Yükleme hatası!";
        }
    });

    // YENİ: Sınavı otomatik sonlandıran asıl fonksiyon
    async function sinaviVeritabanindaBitir() {
        try {
            await setDoc(doc(db, "aktif_sinav", "deneme_paketi"), { durum: "bitti" }, { merge: true });
            durumYazisi.innerHTML = "⏹ Süre doldu. Sınav herkes için otomatik sonlandırıldı.";
            btnBitir.style.display = "none";
            btnBaslat.style.display = "block";
            document.getElementById('hedefSoru').disabled = false;
            document.getElementById('sinavSuresi').disabled = false;
            adminSayacGosterge.style.display = "none"; // Sayacı gizle
            clearInterval(adminSayacInterval);
        } catch (e) { console.error("Otomatik bitirme hatası:", e); }
    }

    // YENİ: Admin panelinde geriye doğru sayan görsel motor
    function baslatAdminSayaci(sureDakika) {
        let kalanSaniye = sureDakika * 60;
        adminSayacGosterge.style.display = "block";
        adminSayacGosterge.classList.remove("tehlike");

        clearInterval(adminSayacInterval);
        
        adminSayacInterval = setInterval(() => {
            kalanSaniye--;
            
            let dk = Math.floor(kalanSaniye / 60);
            let sn = kalanSaniye % 60;
            adminSayacGosterge.innerText = `Kalan Süre: ${dk < 10 ? '0':''}${dk}:${sn < 10 ? '0':''}${sn}`;
            
            if (kalanSaniye <= 60) {
                adminSayacGosterge.classList.add("tehlike");
            }
            
            // Süre sıfırlandığında şalteri indir
            if(kalanSaniye <= 0) {
                clearInterval(adminSayacInterval);
                sinaviVeritabanindaBitir(); 
            }
        }, 1000);
    }

    // Manuel "Zorla Bitir" butonu kodları güncellendi
    btnBitir.addEventListener('click', async () => {
        clearInterval(adminSayacInterval); // Sayacı manuel olarak durdur
        adminSayacGosterge.style.display = "none";
        
        try {
            await setDoc(doc(db, "aktif_sinav", "deneme_paketi"), { durum: "bitti" }, { merge: true });
            durumYazisi.innerHTML = "⏹ Sınav yönetici tarafından manuel olarak sonlandırıldı.";
            btnBitir.style.display = "none";
            btnBaslat.style.display = "block";
            document.getElementById('hedefSoru').disabled = false;
            document.getElementById('sinavSuresi').disabled = false;
        } catch (e) { console.error(e); }
    });

    // SONUÇLARI ÇEKME VE LİSTELEME
    raporBtn.addEventListener('click', async () => {
        document.getElementById('raporModal').style.display = "flex";
        const raporDiv = document.getElementById('raporTabloAlani');
        raporDiv.innerHTML = "<div style='text-align:center;'>Sonuçlar veritabanından çekiliyor... ⏳</div>";

        try {
            const querySnapshot = await getDocs(collection(db, "deneme_sonuclari"));
            let sonuclar = [];
            querySnapshot.forEach((doc) => {
                let data = doc.data();
                // Eski verilerde puan/net yoksa hata vermemesi için varsayılan değer atıyoruz
                let puan = data.puan !== undefined ? data.puan : 0;
                let net = data.net !== undefined ? data.net : 0;
                sonuclar.push({ isim: doc.id, puan: puan, net: net, dogru: data.dogru, yanlis: data.yanlis, bos: data.bos });
            });

            // PUANA GÖRE BÜYÜKTEN KÜÇÜĞE SIRALAMA
            sonuclar.sort((a, b) => b.puan - a.puan);

            if(sonuclar.length === 0) {
                raporDiv.innerHTML = "<div style='text-align:center;'>Henüz kimse sınavı bitirip skorunu göndermemiş.</div>";
                return;
            }

            let html = `<table><tr><th>Sıra</th><th>Katılımcı Adı</th><th>Puan</th><th>Net</th><th>Doğru</th><th>Yanlış</th><th>Boş</th></tr>`;
            sonuclar.forEach((s, index) => {
                html += `<tr>
                    <td><strong>${index + 1}.</strong></td>
                    <td style="font-weight: bold;">${s.isim}</td>
                    <td style="color:#f59e0b; font-weight: bold; font-size: 18px;">${s.puan.toFixed(1)}</td>
                    <td style="color:#10b981; font-weight: bold;">${s.net.toFixed(2)}</td>
                    <td style="color:#10b981;">${s.dogru}</td>
                    <td style="color:#ef4444;">${s.yanlis}</td>
                    <td style="color:#9ca3af; font-weight: bold;">${s.bos}</td>
                </tr>`;
            });
            html += `</table>`;
            raporDiv.innerHTML = html;
        } catch (e) {
            raporDiv.innerHTML = "Bir hata oluştu: " + e.message;
        }
    });

    document.getElementById('kapatModalBtn').addEventListener('click', () => {
        document.getElementById('raporModal').style.display = "none";
    });
</script>
</body>
</html>
